# Production LiteLLM proxy config for DERVA.
# Callers' keys should be allowed to use only the "derva" model: the pre-call
# hook rewrites it to a tier after the checks pass.
model_list:
  - model_name: derva
    litellm_params:
      model: os.environ/DERVA_FRONTIER_UPSTREAM
  - model_name: derva-small
    litellm_params:
      model: os.environ/DERVA_SMALL_UPSTREAM
  - model_name: derva-frontier
    litellm_params:
      model: os.environ/DERVA_FRONTIER_UPSTREAM

litellm_settings:
  callbacks: derva.gateway.litellm_hook.proxy_handler_instance
  drop_params: true

general_settings:
  # Caller keys and their teams come from DERVA_CALLERS (see derva/gateway/auth.py).
  custom_auth: derva.gateway.auth.user_api_key_auth
  # LiteLLM will not boot without a master key. DERVA's auth does not accept it,
  # so it opens nothing: LiteLLM's admin routes stay closed in v0.1.
  master_key: os.environ/LITELLM_MASTER_KEY

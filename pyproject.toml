[project]
name = "derva"
version = "0.1.0"
description = "DERVA (Decide, Evaluate, Route, Verify, Authorize): an AI gateway with a fast decision layer and maker-checker controls for regulated teams."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Toma Ijatomi" }]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "typer>=0.12",
]

[project.optional-dependencies]
presidio = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
]
postgres = ["psycopg[binary]>=3.2"]
# Pinned: the hooks rely on this version's proxy behaviour (see gateway/litellm_hook.py).
gateway = ["litellm[proxy]==1.105.1"]
evals = ["matplotlib>=3.8"]
gcp = ["google-cloud-storage>=2.18"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
derva = "derva.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/derva"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Regex patterns read better on one line.
"src/derva/deciders/rules.py" = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["derva"]
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# LiteLLM's own TypedDicts trigger these inside pydantic; nothing in DERVA does.
filterwarnings = ["ignore:.*ReadOnly. qualifier:UserWarning"]
markers = [
    "presidio: needs presidio and a spaCy model installed",
    "gateway: needs litellm[proxy] installed",
    "postgres: needs a Postgres the tests may reset (DERVA_TEST_PG_ADMIN_URL)",
]
